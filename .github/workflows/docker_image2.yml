name: Build and push Docker repo image - NEW

on:
  workflow_dispatch:
    inputs:
        base_image:
          default: "ghcr.io/eliteaai/pylon:1.2.31-tools"
          description: "Docker image name and tag (base)"
          required: true
        bundle_object:
          default: ""
          description: "Bundle object key"
          required: true
        version:
          default: "latest"
          description: "Image version (e.g. 2.0.8). Result: ghcr.io/eliteaai/repo:<version>[-<runtime_id>]"
          required: true
        runtime_id:
          type: choice
          default: "www-data"
          description: "Container runtime user/group. Non-default IDs are appended to the tag."
          options:
            - "www-data"
            - "1001020000"
            - "1001900000"
          required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: buildx

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag and runtime user/group
        id: runtime
        env:
          IMAGE_NAME: "ghcr.io/eliteaai/repo"
          VERSION: ${{ inputs.version }}
          RUNTIME_ID: ${{ inputs.runtime_id }}
        run: |
          # Docker tag rules: letters, digits, _ . - ; max 128 chars; can't start with . or -
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid version '$VERSION' (use e.g. 2.0.8 or latest)"
            exit 1
          fi
          if [ "$RUNTIME_ID" = "www-data" ]; then
            TAG="$IMAGE_NAME:$VERSION"
          else
            TAG="$IMAGE_NAME:$VERSION-$RUNTIME_ID"
          fi
          echo "Tag: $TAG -> user/group: $RUNTIME_ID:$RUNTIME_ID"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "user=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
          echo "group=$RUNTIME_ID" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          tags: ${{ steps.runtime.outputs.tag }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          push: true
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=true
            BASE_IMAGE=${{ inputs.base_image }}
            BUNDLE_OBJECT=${{ inputs.bundle_object }}
            RUNTIME_USER=${{ steps.runtime.outputs.user }}
            RUNTIME_GROUP=${{ steps.runtime.outputs.group }}

